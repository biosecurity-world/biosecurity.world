name: deploy
on:
  push:
    paths:
      - "**"
      - "!.github/**"
      - "!public/data/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - uses: cachix/install-nix-action@v27

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build

      - name: Cache composer packages
        id: cache-composer
        uses: actions/cache@v5
        env:
          cache-name: cache-composer-packages
        with:
          path: ~/.composer-store
          key: build-${{ env.cache-name }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: nix develop --ignore-environment --keep COMPOSER_HOME --command composer install --no-dev -o
        env:
          COMPOSER_HOME: ~/.composer-store

      - name: Copy .env
        run: cp .env.example .env

      - name: Add credentials to .env
        run: |
          echo "NOTION_DATABASE=${{ vars.NOTION_DATABASE }}" >> .env
          echo "NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}" >> .env
          echo "LOGO_DEV_TOKEN=${{ secrets.LOGO_DEV_TOKEN }}" >> .env

      - name: Export entries CSV
        run: nix develop --ignore-environment --command php artisan app:export-data

      - name: Check Notion publication integrity
        run: nix develop --ignore-environment --command php artisan app:check-notion-publication

      - name: Check location region mapping
        run: nix develop --ignore-environment --command php artisan app:check-location-regions

      - name: Install bare
        run: go install github.com/felixdorn/bare@v0.2.0

      - name: Start server
        run: nix develop --ignore-environment --command php artisan serve --host 0.0.0.0 --port 8000 &

      - name: Build website
        run: bare export --js-executable=${{ steps.setup-chrome.outputs.chrome-path }}
        env:
          NOTION_DATABASE: ${{ vars.NOTION_DATABASE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Copy data CSV into dist
        run: |
          mkdir -p dist/data
          cp public/data/entries.csv dist/data/entries.csv

      - name: Deploy website
        run: nix develop --ignore-environment --keep CLOUDFLARE_ACCOUNT_ID --keep CLOUDFLARE_API_TOKEN --keep BRANCH_NAME --command wrangler pages deploy ./dist --project-name biosecurity-world --branch ${BRANCH_NAME}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Commit refreshed CSV to repo (master only)
        if: github.ref_name == 'master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/entries.csv
          if git diff --staged --quiet; then
            echo "No CSV changes — skipping commit."
          else
            git commit -m "data: refresh entries.csv"
            git push
          fi
