name: pending-notion-alert

# Weekly check for organisations left in the "Pending" Notion status.
# When any are found, a single tracking GitHub issue (label: pending-notion)
# is opened/updated and the maintainer is pinged; it auto-closes once the
# list is empty again.
#
# GitHub cron is UTC and does NOT follow daylight saving.
# 16:00 UTC on Fridays ≈ 18:00 Europe/Paris in summer (CEST) / 17:00 in winter (CET).
on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:

jobs:
  check-pending:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v27

      - name: Cache composer packages
        id: cache-composer
        uses: actions/cache@v5
        env:
          cache-name: cache-composer-packages
        with:
          path: ~/.composer-store
          key: build-${{ env.cache-name }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: nix develop --ignore-environment --keep COMPOSER_HOME --command composer install --no-dev -o
        env:
          COMPOSER_HOME: ~/.composer-store

      - name: Copy .env
        run: cp .env.example .env

      - name: Add credentials to .env
        run: |
          echo "NOTION_DATABASE=${{ vars.NOTION_DATABASE }}" >> .env
          echo "NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}" >> .env

      - name: Detect pending entries
        id: detect
        run: |
          nix develop --ignore-environment --command php artisan app:report-pending-entries > pending.md
          if [ -s pending.md ]; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
            echo "count=$(grep -c '^- ' pending.md)" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update alert issue
        if: steps.detect.outputs.has_pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.detect.outputs.count }}
        run: |
          set -euo pipefail
          title="⏳ Orgs Notion en attente de validation (Pending)"
          label="pending-notion"
          # Create the label once; ignore the error if it already exists.
          gh label create "$label" --color FBCA04 --description "Orgs Notion au statut Pending" 2>/dev/null || true
          {
            echo "Des organisations sont au statut **Pending** dans Notion et n'apparaissent donc pas encore sur le site :"
            echo
            cat pending.md
            echo
            echo "_Vérifié automatiquement le $(date -u '+%Y-%m-%d %H:%M UTC'). Passez leur Status à autre chose que Pending (ou archivez-les) pour les publier ; cette issue se ferme d'elle-même quand la liste est vide._"
          } > body.md
          issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file body.md
            gh issue comment "$issue" --body "🔁 Point hebdomadaire : ${COUNT} org(s) toujours en attente au $(date -u '+%Y-%m-%d %H:%M UTC'). Voir la description mise à jour."
          else
            gh issue create --title "$title" --label "$label" --body-file body.md --assignee Jeremy-Andreoletti \
              || gh issue create --title "$title" --label "$label" --body-file body.md
          fi

      - name: Close alert issue when nothing is pending
        if: steps.detect.outputs.has_pending == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --label pending-notion --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "✅ Plus aucune org en attente au $(date -u '+%Y-%m-%d %H:%M UTC'). Clôture automatique."
            gh issue close "$issue"
          fi
